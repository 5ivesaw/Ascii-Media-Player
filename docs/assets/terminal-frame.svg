<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">ASCII Media Player terminal interface</title>
  <desc id="desc">A dark terminal window showing a cyan ASCII spectrum and playback information.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1200" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111f2d"/>
      <stop offset="1" stop-color="#081019"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="170" x2="1000" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c9f4ff"/>
      <stop offset=".5" stop-color="#70d8ff"/>
      <stop offset="1" stop-color="#718dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="590" rx="34" fill="#05090d"/>
  <g filter="url(#shadow)">
    <rect x="40" y="38" width="1120" height="514" rx="24" fill="url(#frame)" stroke="#284157" stroke-width="2"/>
    <path d="M40 100h1120" stroke="#284157"/>
    <circle cx="78" cy="69" r="7" fill="#182b3b" stroke="#4b687d"/>
    <circle cx="102" cy="69" r="7" fill="#182b3b" stroke="#4b687d"/>
    <circle cx="126" cy="69" r="7" fill="#182b3b" stroke="#4b687d"/>
    <text x="600" y="74" text-anchor="middle" fill="#6f8799" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">ASCII MEDIA PLAYER / LIVE SIGNAL</text>
    <text x="1098" y="74" text-anchor="end" fill="#64e6b3" font-family="ui-monospace, monospace" font-size="12">PLAYING</text>
  </g>
  <g font-family="ui-monospace, monospace">
    <text x="78" y="139" fill="#70d8ff" font-size="13" letter-spacing="2">NOW PLAYING</text>
    <text x="78" y="166" fill="#eef7ff" font-size="21" font-weight="700">Midnight Signal.flac</text>
    <text x="78" y="191" fill="#70889b" font-size="12">03 / 12 · FLAC · LOCAL CACHE READY</text>
  </g>
  <rect x="76" y="220" width="1048" height="244" rx="14" fill="#03080c" stroke="#1d3a4e"/>
  <g opacity=".16" stroke="#70d8ff">
    <path d="M76 260h1048M76 300h1048M76 340h1048M76 380h1048M76 420h1048"/>
    <path d="M156 220v244M236 220v244M316 220v244M396 220v244M476 220v244M556 220v244M636 220v244M716 220v244M796 220v244M876 220v244M956 220v244M1036 220v244"/>
  </g>
  <g fill="url(#accent)" filter="url(#glow)" opacity=".95">
