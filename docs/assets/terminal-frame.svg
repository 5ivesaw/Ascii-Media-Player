  </g>
  <g font-family="ui-monospace, monospace" font-size="12">
    <text x="78" y="506" fill="#6f8799">01:42</text>
    <rect x="128" y="497" width="858" height="4" rx="2" fill="#1e3445"/>
    <rect x="128" y="497" width="386" height="4" rx="2" fill="#70d8ff"/>
