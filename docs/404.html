<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cf1738">
  <meta name="robots" content="noindex">
  <title>FiveSaw Signal Route</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f5f5f2; background: repeating-linear-gradient(90deg,#111318 0 79px,#111114 80px); }
    main { width: min(620px, calc(100% - 30px)); padding: clamp(28px,7vw,64px); border: 2px solid #f5f5f2; border-left: 8px solid #cf1738; background: #0b0b0d; box-shadow: 14px 14px 0 rgba(220,15,45,.25); clip-path: polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px)); }
    small { color: #cf1738; letter-spacing: .18em; }
    h1 { margin: 20px 0 10px; font-family: Impact,"Arial Black",sans-serif; font-size: clamp(3rem,12vw,7rem); line-height: .82; letter-spacing: -.04em; text-transform: uppercase; }
    p { color: #555961; }
    a { display:inline-block; margin-top:18px; padding:13px 18px; color:#fff; background:#cf1738; text-decoration:none; text-transform:uppercase; letter-spacing:.08em; }
  </style>
  <script>window.setTimeout(() => window.location.replace('https://5ivesaw.github.io/Ascii-Media-Player/'), 700);</script>
</head>
<body><main><small>FIVE//SAW / ROUTE ERROR</small><h1>Signal<br>severed.</h1><p>Reconnecting to the ASCII Media Player.</p><a href="https://5ivesaw.github.io/Ascii-Media-Player/">Return to player</a></main></body>
</html>
