<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071018">
  <meta name="robots" content="noindex">
  <title>Returning to ASCII Media Player</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #eef7ff; background: #05090d; }
    main { width: min(520px, calc(100% - 40px)); padding: 32px; border: 1px solid rgba(182,221,255,.2); border-radius: 18px; background: #09111a; }
    p { color: #91a5b6; }
    a { color: #70d8ff; }
  </style>
  <script>
    window.setTimeout(() => window.location.replace('https://5ivesaw.github.io/Ascii-Media-Player/'), 350);
  </script>
</head>
<body>
  <main>
    <h1>Signal route not found</h1>
    <p>Returning to the ASCII Media Player.</p>
    <a href="https://5ivesaw.github.io/Ascii-Media-Player/">Open the player</a>
  </main>
</body>
</html>
